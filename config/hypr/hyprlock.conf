source = ~/.cache/wal/colors-hyprland.conf

general {
    no_fade_in = false
    grace = 0
    disable_loading = true
}

background {
    monitor =
    path = screenshot
    color = $color0
    blur_passes = 3
    blur_size = 3
}

# Weather - Icon
label {
    monitor =
    text = cmd[update:600000] echo "<span>$(~/.config/hypr/scripts/weather.sh icon) </span>"
    color = $color4
    font_size = 36
    font_family = JetBrainsMono Nerd Font
    position = 48, -48
    halign = left
    valign = top
}

# Weather - Temp
label {
    monitor =
    text = cmd[update:600000] ~/.config/hypr/scripts/weather.sh temp
    color = $foreground
    font_size = 36
    font_family = JetBrains Mono Bold
    position = 100, -48
    halign = left
    valign = top
}

# Weather - Description
label {
    monitor =
    text = cmd[update:600000] ~/.config/hypr/scripts/weather.sh desc
    color = $color4
    font_size = 14
    font_family = JetBrains Mono
    position = 48, -110
    halign = left
    valign = top
}

# Wind
label {
    monitor =
    text = cmd[update:600000] echo "$(~/.config/hypr/scripts/weather.sh wind)"
    color = $foreground
    font_size = 14
    font_family = JetBrains Mono
    position = 48, -133
    halign = left
    valign = top
    opacity = 0.7
    shadow_passes = 1
}

# City
label {
    monitor =
    text = cmd[update:0] ~/.config/hypr/scripts/weather.sh city
    color = $color1
    font_size = 12
    font_family = JetBrains Mono
    position = 48, -160
    halign = left
    valign = top
}

# Clock
label {
    monitor =
    text = $TIME
    color = $color4
    font_size = 96
    font_family = JetBrains Mono Light
    position = 0, 200
    halign = center
    valign = center
}

shape {
    monitor =
    size = 50, 2
    color = $color1
    rounding = 1
    position = 0, 125
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A %d %B %Y" | awk '{for(i=1;i<=NF;i++) $i=toupper(substr($i,1,1))substr($i,2); print}'
    color = $foreground
    font_size = 16
    font_family = JetBrains Mono
    position = 0, 100
    halign = center
    valign = center
}

# Input
input-field {
    monitor =
    size = 300, 48
    outline_thickness = 1
    dots_size = 0.22
    dots_spacing = 0.25
    dots_center = true
    dots_rounding = -1
    outer_color = $color4
    inner_color = rgba(0, 0, 0, 0.45)
    font_color = $foreground
    font_family = JetBrains Mono
    check_color = $color2
    fail_color = $color1
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    fade_on_empty = true
    fade_timeout = 2000
    placeholder_text = Password...
    hide_input = false
    rounding = 12
    position = 0, 0
    halign = center
    valign = center
}

# Hostname
label {
    monitor =
    text = cmd[update:0] hostname
    color = $color4
    font_size = 11
    font_family = JetBrains Mono
    position = 16, 16
    halign = left
    valign = bottom
}
